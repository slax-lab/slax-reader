name: API deploy

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      code-ref:
        required: true
        type: string
    # Environment secrets resolve in the guarded job; named callers are supported.
    secrets:
      API_CONFIG_REPOSITORY:
        required: false
      API_CONFIG_MANIFEST_PATH:
        required: false
      CONFIG_REPO_TOKEN:
        required: false
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_FIREWALL_API_TOKEN:
        required: false
      CLOUDFLARE_TUNNEL_CLIENT_ID:
        required: false
      CLOUDFLARE_TUNNEL_TOKEN:
        required: false
      HYPERDRIVE_DATABASE_URL:
        required: false
      LOGS_DATABASE_URL:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'closed' &&
      github.event.pull_request.merged == true &&
      github.event.repository.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository &&
      inputs.code-ref != '' &&
      inputs.code-ref == github.event.pull_request.merge_commit_sha &&
      ((github.event.pull_request.base.ref == 'dev' && inputs.environment == 'dev') ||
       (github.event.pull_request.base.ref == 'beta' && inputs.environment == 'beta') ||
       (github.event.pull_request.base.ref == 'main' && inputs.environment == 'prod'))
    runs-on: ubuntu-latest
    timeout-minutes: 50
    environment: ${{ inputs.environment }}
    concurrency:
      group: api-release-${{ inputs.environment == 'dev' && 'test' || 'shared-production' }}
      cancel-in-progress: false
    steps:
      - name: Validate merged source before checkout
        env:
          RELEASE_CODE_REF: ${{ inputs.code-ref }}
        run: |
          python3 - <<'PY'
          import json, os, re
          with open(os.environ['GITHUB_EVENT_PATH']) as source:
              event = json.load(source)
          pr = event.get('pull_request', {})
          if not (re.fullmatch('[a-f0-9]{40}', os.environ['RELEASE_CODE_REF']) and
                  pr.get('merge_commit_sha') == os.environ['RELEASE_CODE_REF'] and
                  isinstance(pr.get('number'), int) and pr['number'] > 0):
              raise SystemExit('Invalid merged source')
          PY
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.code-ref }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pnpm install --frozen-lockfile
      - name: Verify release policy without private configuration
        run: node --test tooling/api-release.test.mjs
      - name: Install pinned Cloudflare client before loading private data
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/cloudflare/cloudflared/releases/download/2026.10.0/cloudflared-linux-amd64 \
            --output "$RUNNER_TEMP/cloudflared"
          printf '%s  %s\n' 'd33ff2d14475178d2012c2c56beba87389ac5ded27649519f198a7d3134a99db' "$RUNNER_TEMP/cloudflared" | sha256sum --check
          sudo install -m 755 "$RUNNER_TEMP/cloudflared" /usr/local/bin/cloudflared
          rm "$RUNNER_TEMP/cloudflared"
      - name: Validate, migrate and release with private output captured
        env:
          RELEASE_ENVIRONMENT: ${{ inputs.environment }}
          RELEASE_CODE_REF: ${{ inputs.code-ref }}
          GH_TOKEN: ${{ github.token }}
          API_CONFIG_REPOSITORY: ${{ secrets.API_CONFIG_REPOSITORY }}
          API_CONFIG_MANIFEST_PATH: ${{ secrets.API_CONFIG_MANIFEST_PATH || 'api/releases.json' }}
          CONFIG_REPO_TOKEN: ${{ secrets.CONFIG_REPO_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_FIREWALL_API_TOKEN: ${{ secrets.CLOUDFLARE_FIREWALL_API_TOKEN }}
          CLOUDFLARE_TUNNEL_CLIENT_ID: ${{ secrets.CLOUDFLARE_TUNNEL_CLIENT_ID }}
          CLOUDFLARE_TUNNEL_TOKEN: ${{ secrets.CLOUDFLARE_TUNNEL_TOKEN }}
          HYPERDRIVE_DATABASE_URL: ${{ secrets.HYPERDRIVE_DATABASE_URL }}
          LOGS_DATABASE_URL: ${{ secrets.LOGS_DATABASE_URL }}
        run: node tooling/api-release.mjs run
      - name: Always retry owned-access and private-file cleanup
        if: ${{ always() }}
        env:
          CLOUDFLARE_FIREWALL_API_TOKEN: ${{ secrets.CLOUDFLARE_FIREWALL_API_TOKEN }}
        run: node tooling/api-release.mjs cleanup
