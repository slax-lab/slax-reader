name: Tooling CI
on:
  pull_request: null
  workflow_call:
    inputs:
      full_validation:
        description: Run all checks without scope detection
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-tooling-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
jobs:
  changes:
    if: ${{ !inputs.full_validation }}
    runs-on: ubuntu-latest
    outputs:
      tooling: ${{ steps.scope.outputs.tooling }}
      cliTooling: ${{ steps.scope.outputs.cliTooling }}
      extensionTooling: ${{ steps.scope.outputs.extensionTooling }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.2
          - 26.12.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:preflight
      - run: pnpm test:ci
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.tooling == 'true')) }}
  cli-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:cli-tooling
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.cliTooling == 'true')) }}
  extension-release:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.extensionTooling == 'true')) }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:extension-tooling
  tooling-gate:
    # The dev and beta rulesets require this exact job name.
    name: Tooling CI gate
    if: always()
    needs: [changes, check, cli-release, extension-release]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a suite job did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Tooling CI gate fails closed: a needed job concluded '$result'."
                exit 1
                ;;
            esac
          done
