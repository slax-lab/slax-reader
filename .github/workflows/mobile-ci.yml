name: Mobile CI

on:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - 'docs/mobile/**'
      - 'packages/contracts/**'
      - 'tooling/mobile.mjs'
      - 'tooling/pnpm-command.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ci.yml'
  push:
    branches: [dev, beta, main]
    paths:
      - 'apps/mobile/**'
      - 'docs/mobile/**'
      - 'packages/contracts/**'
      - 'tooling/mobile.mjs'
      - 'tooling/pnpm-command.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EXPO_NO_DOTENV: '1'
  CI: '1'

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile -- check
      - run: pnpm mobile -- bundle

  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile -- prebuild:clean --platform android
      - run: pnpm mobile -- build:android -PreactNativeArchitectures=arm64-v8a,x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk

  ios:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm mobile -- prebuild:clean --platform ios
      - run: pnpm mobile -- pods
      - run: pnpm mobile -- build:ios
