name: CLI CI

on:
  pull_request:
    paths:
      - 'apps/cli/**'
      - 'packages/contracts/**'
      - 'tooling/cli*.mjs'
      - 'tooling/pnpm-command.mjs'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/cli-*.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node: ['22.22.2', '24.15.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cli -- typecheck
      - run: pnpm cli -- test
      - run: pnpm test:cli-tooling
      - run: pnpm test:preflight
      - run: pnpm cli -- test:package
