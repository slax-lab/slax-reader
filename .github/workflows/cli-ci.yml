name: CLI CI
on:
  pull_request: null
  workflow_call:
    inputs:
      full_validation:
        description: Run all checks without scope detection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    if: ${{ !inputs.full_validation }}
    runs-on: ubuntu-latest
    outputs:
      cli: ${{ steps.scope.outputs.cli }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.22.2
          - 24.15.0
          - 26.12.1
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm cli -- typecheck
      - run: pnpm cli -- test
      - run: pnpm cli -- test:package
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.cli == 'true')) }}
  cli-gate:
    # The dev and beta rulesets require this exact job name.
    name: CLI CI gate
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a suite job did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::CLI CI gate fails closed: a needed job concluded '$result'."
                exit 1
                ;;
            esac
          done
concurrency:
  group: ${{ github.workflow }}-cli-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
