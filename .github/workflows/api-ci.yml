name: API CI
on:
  pull_request: null
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scope.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
  check:
    runs-on: ubuntu-latest
    env:
      HYPERDRIVE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_generation_only
      LOGS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_logs_generation_only
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api -- config:init
      - run: pnpm api -- gen:all
      - run: pnpm api -- lint
      - run: pnpm api -- typecheck
      - run: pnpm api -- test
      - name: Bundle all four Workers without deployment
        run: pnpm api -- build
    needs: changes
    if: ${{ needs.changes.outputs.api == 'true' }}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
