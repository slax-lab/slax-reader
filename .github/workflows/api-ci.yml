name: API CI
on:
  pull_request: null
  workflow_call:
    inputs:
      full_validation:
        description: Run all checks without scope detection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    if: ${{ !inputs.full_validation }}
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.scope.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
  check:
    runs-on: ubuntu-latest
    env:
      HYPERDRIVE_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_generation_only
      LOGS_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ci_logs_generation_only
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm api -- config:init
      - run: pnpm api -- gen:all
      - run: pnpm api -- lint
      - run: pnpm api -- typecheck
      - run: pnpm api -- test
      - name: Bundle all four Workers without deployment
        run: pnpm api -- build
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.api == 'true')) }}
  api-gate:
    # The dev and beta rulesets require this exact job name.
    name: API CI gate
    if: always()
    needs: [changes, check]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a suite job did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::API CI gate fails closed: a needed job concluded '$result'."
                exit 1
                ;;
            esac
          done
concurrency:
  group: ${{ github.workflow }}-api-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
