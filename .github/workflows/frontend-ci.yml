name: Frontend CI
on:
  pull_request: null
  workflow_call:
    inputs:
      full_validation:
        description: Run all checks without scope detection
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  changes:
    if: ${{ !inputs.full_validation }}
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.scope.outputs.web }}
      extension: ${{ steps.scope.outputs.extension }}
      design: ${{ steps.scope.outputs.design }}
      icons: ${{ steps.scope.outputs.icons }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
  web:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: '0'
      NUXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      PUBLIC_BASE_URL: http://localhost:3000
      AUTH_BASE_URL: http://localhost:3000
      SHARE_BASE_URL: http://localhost:3000
      DWEB_API_BASE_URL: http://localhost:8787
      EXTENSIONS_API_BASE_URL: http://localhost:8787
      COOKIE_DOMAIN: localhost
      COOKIE_TOKEN_NAME: slax_test
      GOOGLE_OAUTH_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:test
      - run: pnpm icons:check
      - run: pnpm --filter @slax-reader/contracts typecheck
      - run: pnpm --filter @apps/slax-reader-dweb typecheck
      - run: pnpm --filter @slax-reader/selection typecheck
      - run: pnpm web -- test
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.web == 'true')) }}
  extension:
    runs-on: ubuntu-latest
    env:
      FORCE_COLOR: '0'
      NUXT_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
      PUBLIC_BASE_URL: http://localhost:3000
      AUTH_BASE_URL: http://localhost:3000
      SHARE_BASE_URL: http://localhost:3000
      DWEB_API_BASE_URL: http://localhost:8787
      EXTENSIONS_API_BASE_URL: http://localhost:8787
      COOKIE_DOMAIN: localhost
      COOKIE_TOKEN_NAME: slax_test
      GOOGLE_OAUTH_CLIENT_ID: ci-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @slax-reader/contracts typecheck
      - run: pnpm --filter @apps/slax-reader-extensions compile
      - run: pnpm --filter @slax-reader/selection typecheck
      - run: pnpm extension -- test
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.extension == 'true')) }}
  design:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: node tooling/design-reference.mjs
    needs: changes
    if: ${{ !cancelled() && (inputs.full_validation || (needs.changes.result == 'success' && needs.changes.outputs.design == 'true')) }}
  icons:
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && !inputs.full_validation && needs.changes.result == 'success' && needs.changes.outputs.icons == 'true' && needs.changes.outputs.web != 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm icons:test
      - run: pnpm icons:check
  web-gate:
    # The dev and beta rulesets require this exact job name.
    name: Web CI gate
    if: always()
    needs: [changes, web, extension, design, icons]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a suite job did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Web CI gate fails closed: a needed job concluded '$result'."
                exit 1
                ;;
            esac
          done
  extension-gate:
    # The dev and beta rulesets require this exact job name.
    name: Extension CI gate
    if: always()
    needs: [changes, web, extension, design, icons]
    runs-on: ubuntu-latest
    steps:
      - name: Fail when a suite job did not pass
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "::error::Extension CI gate fails closed: a needed job concluded '$result'."
                exit 1
                ;;
            esac
          done
concurrency:
  group: ${{ github.workflow }}-frontend-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true
