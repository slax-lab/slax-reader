name: Agentic noise cleanup

# gh-aw opens bookkeeping issues for its own runs ("[aw] No-Op Runs",
# "[aw] Detection Runs", "[aw] Failed jobs: …"). They are automation noise: the
# real signal for a failed review is the `Agentic PR review` status check, and
# REVIEW.md says so. gh-aw v0.88.7 has no frontmatter switch that suppresses the
# failed-job path (`GH_AW_REPORT_FAILED_JOBS` stays "true" even with
# `safe-outputs.report-failure-as-issue: false` and `report-failed-jobs: false` —
# tasks 1.8/7.8/7.16), so this deterministic workflow closes those issues,
# leaving a comment that points at the failing run for anyone who wants the detail.
#
# There is deliberately **no `issues: [opened]` trigger**. The first version had
# one and never ran: gh-aw creates these issues with the workflow's own
# `GITHUB_TOKEN`, and GitHub suppresses workflow runs caused by that token (only
# `workflow_dispatch` and `repository_dispatch` are exempt) to stop recursion.
# Issues #30–#32 sat open while the only run on record was a human-created drill
# that was correctly skipped — the negative case verified, the positive one never.
# A trigger that cannot fire is worse than no trigger, so the sweep is driven by
# `schedule` and can be run on demand with `workflow_dispatch`.
#
# Scope is deliberately narrow: only issues labelled `agentic-workflows` that were
# opened by the GitHub Actions bot AND titled with the `[aw] ` prefix.

on:
  schedule:
    # Every six hours, at :41 so it does not pile up with the top-of-hour runs.
    - cron: '41 */6 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - name: Close the automation issues and point at each failing run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          # The issue body already carries the run that failed, so the comment can
          # point at it; the cleanup run itself holds no detail about the issue.
          failing_run_url() {
            local number="$1" body url
            body=$(gh issue view "$number" --repo "$GITHUB_REPOSITORY" --json body --jq .body 2>/dev/null || true)
            url=$(printf '%s\n' "$body" | grep -oE 'https://[^ )]*/actions/runs/[0-9]+' | head -1 || true)
            printf '%s' "${url:-$RUN_URL}"
          }

          # A failed close is reported and counted, not fatal: the point is to
          # drain a backlog, so one rate limit must not strand the rest.
          close_issue() {
            local number="$1" detail
            detail=$(failing_run_url "$number")
            if gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason "not planned" --comment \
              "Closing automatically: this is gh-aw automation bookkeeping, not a project issue. The status check \`Agentic PR review\` is the signal that matters (see REVIEW.md → Automated review). Run: $detail"; then
              echo "Closed #${number}"
              return 0
            fi
            echo "::warning::could not close #${number}"
            return 1
          }

          # The search must be allowed to fail loudly: "nothing matched" and
          # "could not look" are different outcomes, and this workflow exists
          # precisely because a cleanup that silently does nothing is invisible.
          # (A process substitution would hide the exit status here, so the result
          # is captured into a variable first.)
          #
          # The REST API, not `gh issue list`: the two disagree about the author of
          # a workflow-created issue. REST reports `github-actions[bot]`, while the
          # GraphQL-backed listing reports `app/github-actions` — which is why the
          # first version of this search matched nothing and the sweep reported
          # "No open automation issues." over three open ones. `--paginate` also
          # removes the page-size ceiling the `--limit` version had.
          if ! listing=$(gh api --paginate \
                "repos/${GITHUB_REPOSITORY}/issues?state=open&labels=agentic-workflows&per_page=100" \
                --jq '.[] | select(.pull_request == null) | select(.user.login == "github-actions[bot]") | select(.title | startswith("[aw] ")) | .number'); then
            echo "::error::issue search failed; the sweep did not run"
            exit 1
          fi
          if [ -z "$listing" ]; then
            echo "No open automation issues."
            exit 0
          fi

          # A portable `while read` loop rather than `mapfile`: it works on any
          # bash (including the 3.2 a maintainer may have locally, which makes this
          # step testable outside a runner).
          closed=0
          failed=0
          while IFS= read -r number; do
            [ -n "$number" ] || continue
            if close_issue "$number"; then
              closed=$((closed + 1))
            else
              failed=$((failed + 1))
            fi
          done <<<"$listing"

          echo "Swept ${closed} issue(s); ${failed} failed."
          # Closing nothing while something failed is exactly the invisible outcome
          # this workflow exists to prevent, so it must not end green.
          if [ "$closed" -eq 0 ] && [ "$failed" -gt 0 ]; then
            echo "::error::every close failed; the sweep achieved nothing"
            exit 1
          fi
