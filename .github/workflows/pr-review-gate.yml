name: PR review gate

# Companion gate (design D4, task 7.2).
#
# The review workflow cannot report a reliable required check on its own: gh-aw
# gates its verdict job on the agent having emitted a verdict, and a *skipped* job
# counts as passing for a required check — so a run that produced no verdict would
# silently pass the gate. This workflow is therefore the single required check: it
# runs after any review workflow completes and always reports one status per
# reviewed commit, failing closed when no verdict exists.
#
# Required check context: "Agentic PR review" (task 5.2).
#
# Known limitation (task 7.9): statuses are attached to the reviewed commit, so a
# later push to the same pull request has no status until a new review runs. The
# intended path is `/review`; tightening this is tracked as a follow-up.

on:
  workflow_run:
    workflows: ["PR Review", "PR Review (on demand)"]
    types: [completed]

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Report the gate status for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONTEXT="Agentic PR review"

          JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | {name: .name, conclusion: .conclusion}]')
          agent=$(jq -r '.[] | select(.name == "agent") | .conclusion' <<<"$JOBS" | head -1)
          verdict=$(jq -r '.[] | select(.name == "review_verdict") | .conclusion' <<<"$JOBS" | head -1)
          agent=${agent:-missing}
          verdict=${verdict:-missing}

          case "$agent" in
            skipped)
              state=success
              desc="Review skipped (paused, fork pull request, or budget cap)"
              ;;
            success)
              case "$verdict" in
                success)
                  state=success
                  desc="Reviewed: no Important findings"
                  ;;
                failure)
                  state=failure
                  desc="Review reported Important findings"
                  ;;
                *)
                  state=failure
                  desc="Review ran but produced no verdict; failing closed"
                  ;;
              esac
              ;;
            *)
              state=failure
              desc="Review did not complete (agent job: $agent); failing closed"
              ;;
          esac

          echo "agent=$agent verdict=$verdict -> state=$state ($desc)"
          gh api -X POST "repos/$REPO/statuses/$HEAD_SHA" \
            -f state="$state" \
            -f context="$CONTEXT" \
            -f description="$desc" \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" > /dev/null
