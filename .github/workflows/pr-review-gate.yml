name: PR review gate

# Companion gate (design D4, tasks 7.2/7.11).
#
# The review workflow cannot report a reliable required check on its own: gh-aw
# gates its verdict job on the agent having emitted a verdict, and a *skipped* job
# counts as passing for a required check — so a run that produced no verdict would
# silently pass. This workflow is the single required check: it runs after any
# review workflow completes and always reports one status, failing closed when no
# verdict exists.
#
# Which commit the status belongs to: the automatic review runs on the pull request
# head, but the on-demand one is triggered by `issue_comment` and therefore runs
# from the default branch, where `workflow_run.head_sha` is main's tip. Both review
# workflows set a `run-name` containing the pull request number ("… for #<n>"), so
# the gate resolves the reviewed pull request from the run's display title and uses
# that pull request's head SHA, falling back to `head_sha` when it cannot.
#
# Required check context: "Agentic PR review" (task 5.2).

on:
  workflow_run:
    workflows: ["PR Review", "PR Review (on demand)"]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: read
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Report the gate status for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          PAYLOAD_SHA: ${{ github.event.workflow_run.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          CONTEXT="Agentic PR review"

          JOBS=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --jq '[.jobs[] | {name: .name, conclusion: .conclusion}]')
          agent=$(jq -r '.[] | select(.name == "agent") | .conclusion' <<<"$JOBS" | head -1)
          verdict=$(jq -r '.[] | select(.name == "review_verdict") | .conclusion' <<<"$JOBS" | head -1)
          agent=${agent:-missing}
          verdict=${verdict:-missing}

          case "$agent" in
            skipped)
              state=success
              desc="Review skipped (paused, fork pull request, or budget cap)"
              ;;
            success)
              case "$verdict" in
                success)
                  state=success
                  desc="Reviewed: no Important findings"
                  ;;
                failure)
                  state=failure
                  desc="Review reported Important findings"
                  ;;
                *)
                  state=failure
                  desc="Review ran but produced no verdict; failing closed"
                  ;;
              esac
              ;;
            *)
              state=failure
              desc="Review did not complete (agent job: $agent); failing closed"
              ;;
          esac

          # Resolve the reviewed commit: prefer the pull request named in the run's
          # display title (correct for both trigger paths), else the payload SHA.
          SHA="$PAYLOAD_SHA"
          TITLE=$(gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.display_title // ""' 2>/dev/null || echo "")
          PR_NUMBER=$(sed -n 's/.*#\([0-9][0-9]*\).*/\1/p' <<<"$TITLE" | head -1)
          if [ -n "${PR_NUMBER:-}" ]; then
            RESOLVED=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.head.sha' 2>/dev/null || echo "")
            if [ -n "$RESOLVED" ]; then
              SHA="$RESOLVED"
              echo "Resolved pull request #$PR_NUMBER (from \"$TITLE\") to head $SHA"
            else
              echo "::warning::Could not resolve pull request #$PR_NUMBER; falling back to payload SHA $SHA"
            fi
          else
            echo "No pull request number in run title \"$TITLE\"; using payload SHA $SHA"
          fi

          echo "agent=$agent verdict=$verdict -> state=$state ($desc) on $SHA"
          gh api -X POST "repos/$REPO/statuses/$SHA" \
            -f state="$state" \
            -f context="$CONTEXT" \
            -f description="$desc" \
            -f target_url="https://github.com/$REPO/actions/runs/$RUN_ID" > /dev/null
