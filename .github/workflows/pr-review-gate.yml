name: PR review gate

# Reports the single required "PR review gate" status from positive evidence
# about each review run. The tested Node module owns run identification, verdict
# calculation, cancellation handling, and readiness-label updates.
# This workflow_run trigger exists only on the default branch.
on:
  workflow_run:
    workflows: ["PR Review", "PR Review (on demand)"]
    types: [completed]

permissions:
  actions: read
  contents: read
  # Creating the label object needs issues: write; changing it on a pull request
  # additionally needs pull-requests: write.
  issues: write
  pull-requests: write
  statuses: write

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      # Execute only reviewed code from the same default branch that supplied
      # this workflow definition.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Report the gate status for the reviewed commit
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          REPO: ${{ github.repository }}
          # Cross-repository contract with slax-lab/slax-notify-bridge's
          # per-repository notification policy: renaming it requires changing both.
          READY_LABEL: ready-for-human-review
          # Read here rather than inferred because declined stage conclusions do
          # not distinguish pause, fork, draft, or other activation decisions.
          PAUSED: ${{ vars.PR_REVIEW_ENABLED == 'false' }}
        run: node tooling/pr-review-gate.mjs
