# Keep the required context stable; select its expensive checks from the complete PR diff.
name: agent-config
on:
  pull_request: null
jobs:
  guard:
    # The release-branches ruleset requires this exact job name.
    name: agent-config drift check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        uses: ./.github/actions/ci-scope
      - uses: pnpm/action-setup@v6
        if: >-
          steps.scope.outputs.rulesync == 'true' || steps.scope.outputs.openspec == 'true' || steps.scope.outputs.ghAw
          == 'true'
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
        if: >-
          steps.scope.outputs.rulesync == 'true' || steps.scope.outputs.openspec == 'true' || steps.scope.outputs.ghAw
          == 'true'
      - run: pnpm install --frozen-lockfile
        if: >-
          steps.scope.outputs.rulesync == 'true' || steps.scope.outputs.openspec == 'true' || steps.scope.outputs.ghAw
          == 'true'
      - name: rulesync drift check
        run: |
          pnpm exec rulesync doctor --strict
          pnpm exec rulesync generate --check
        if: steps.scope.outputs.rulesync == 'true'
      - name: openspec validate
        run: pnpm exec openspec validate --all --strict
        env:
          OPENSPEC_TELEMETRY: '0'
          OPENSPEC_NO_UPDATE_CHECK: '1'
        if: steps.scope.outputs.openspec == 'true'
      - name: Install gh-aw CLI (pinned)
        uses: github/gh-aw/actions/setup-cli@v0.88.7
        with:
          version: v0.88.7
        if: steps.scope.outputs.ghAw == 'true'
      - name: gh-aw compile drift check
        run: |
          set -euo pipefail
          # A *full* compile is required: compiling a single workflow does not
          # purge orphaned lock files, so a per-file check would miss exactly the
          # drift that matters.
          gh aw compile --strict --purge --no-check-update
          # Only generated paths are inspected: hand-edited workflow sources (this
          # file, the review wrappers, the paused-notice companion) are not drift.
          DRIFT=$(git status --porcelain -- \
            '.github/workflows/*.lock.yml' \
            '.github/aw')
          if [ -n "$DRIFT" ]; then
            echo "::error::Compiled agentic workflows are out of date."
            echo "Run 'gh aw compile --strict --purge' and commit the result."
            echo "$DRIFT"
            exit 1
          fi
          echo "Compiled workflows match their sources."
        if: steps.scope.outputs.ghAw == 'true'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
