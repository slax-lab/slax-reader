name: PR review paused notice

# Deterministic companion to the review workflow (design D10, task 1.7).
#
# `pr-review` is gated by the repository variable PR_REVIEW_ENABLED. Automatic
# runs stay silent while paused, but somebody who explicitly asks for a review
# with `/review` must be told that the **automated** review is paused — otherwise
# a paused system is indistinguishable from a broken one, and "reviews are paused"
# reads as human review being unavailable. This workflow is plain GitHub Actions
# rather than gh-aw so that answering costs no agent run and no model request.
#
# Note: GitHub runs `issue_comment` workflows from the default branch, so this
# only takes effect once merged to `main`.

on:
  issue_comment:
    types: [created]

permissions:
  # `gh pr comment` posts to the issues comments endpoint, so it needs issues: write
  # even though the target is a pull request.
  issues: write
  pull-requests: write

jobs:
  notice:
    if: >-
      vars.PR_REVIEW_ENABLED == 'false' &&
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/review') &&
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    steps:
      - name: Tell the requester that the automated review is paused
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          # The reply has to say three things, because the notification surfaces
          # that carry it (the pull request and the team's Feishu bridge) are read
          # out of context: which review is paused, that nothing is broken, and
          # that people are not affected.
          #
          # The trailing marker is a **contract** with the notification bridge,
          # which lives in another repository (`slax-lab/slax-notify-bridge`): that
          # bridge matches this marker so a pause notice can never be confused with
          # a review result. It shipped the marker check in its PR #2; the word
          # "paused" it used before is still present in the body below as a fallback
          # for notices posted earlier, so the wording — not the marker — is what
          # makes the notice honest.
          BODY=$(cat <<'EOF'
          ⏸ **The automated (AI) review is paused** — the repository variable `PR_REVIEW_ENABLED` is set to `false`, so this `/review` request ran no review. Nothing is broken: the pause is a deliberate operator switch.

          Human review is unaffected — reviewers can still comment, approve, request changes and merge as usual.

          To resume AI reviews, a maintainer sets `PR_REVIEW_ENABLED` to `true` (or deletes the variable).

          <!-- slax-notify:review-paused -->
          EOF
          )
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$BODY"
