const $=s=>document.getElementById(s), choices=[['页面底色',['默认','素白','暖纸','夜读']],['正文字色',['自动','炭黑','深棕','暖白']],['字号',['小','标准','大']],['字体',['原字体','宋体','黑体']]], defaults=[0,0,1,0], paper=['','#fff','#f1e5ce','#282a29'],ink=['','#262926','#644736','#f0ebe1'];let device='ios',view='after',sel=[...defaults];const doc={web:'<p>11 月 16 日，Rust 官方宣布：从 nightly-2026-11-14 开始，Rust 编译器的并行前端默认开启！</p><p>这意味着，长期以来只能单线程运行的编译器前端，终于开始向多线程时代迈进。</p><p>为什么这件事值得关注？</p><p>Rust 编译器主要分为前端和后端：</p><p>- 前端：负责类型检查、借用检查等工作。<br>- 后端：基于 LLVM，负责代码生成，早已支持多线程。</p><p>过去，Rust 编译器虽然能并行生成代码，但类型检查、借用检查等前端工作却基本只能依赖一个线程。</p><p>这就像一条生产线：后半段有多个工人同时工作，前半段却只有一个人在忙碌。</p>',ios:'<p>Page Contents</p><b>Accessibility in Context</b><blockquote>The power of the Web is in its universality.<br><br>Access by everyone regardless of disability is an essential aspect.</blockquote><p>The Web is fundamentally designed to work for all people, whatever their hardware, software, language, location, or ability. When the Web meets this goal, it is accessible to people with a diverse range of hearing, movement, sight, and cognitive ability.</p><p>Thus the impact of disability is radically changed on the Web because the Web removes barriers to communication and interaction that many people face in the physical world.</p>'};const profiles={web:{file:'web-reader.png',w:1280,h:900,defaultPaper:'#faf7ef',defaultInk:'#322c26',size:16,font:'Georgia, Songti SC, serif'},ios:{file:'ios-reader.png',w:440,h:956,defaultPaper:'#fcfcfc',defaultInk:'#333333',size:16,font:'-apple-system, BlinkMacSystemFont, Arial, sans-serif'}};function fit(){let p=profiles[device],w=$('viewport').parentElement.clientWidth-(innerWidth<600?12:32),h=Math.max(440,innerHeight-122),s=Math.min(w/p.w,h/p.h,1);$('stage').style.transform='scale('+s+')';$('viewport').style.width=p.w*s+'px';$('viewport').style.height=p.h*s+'px'}function lum(c){if(c==='#fff')c='#ffffff';return [1,3,5].map(i=>parseInt(c.slice(i,i+2),16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4).reduce 80)}const t=$('bodycopy');t.innerHTML=doc[device];t.style.color=fg;t.style.fontFamily=[p.font,'Georgia, Songti SC, STSong, serif','-apple-system, BlinkMacSystemFont, PingFang SC, sans-serif'][sel[3]];t.style.fontSize=p.size*[.9,1,1.18][sel[2]]+'px';t.style.lineHeight=io?'1.65':'1.8'}fit()}for(let k=0;k<choices.length;k++){let [title,labels]=choices[k],g=document.createElement('section');g.className='group';let h=document.createElement('h3');h.textContent=title;g.append(h);let r=document.createElement('div');r.className='options';r.setAttribute('role','group');r.setAttribute('aria-label',title);labels.forEach((l,j)=>{const b=document.createElement('button');b.className='opt';b.dataset.k=k;b.dataset.j=j;b.setAttribute('aria-label',title+'：'+l);if(k<2){const sw=document.createElement('i');sw.className='sw';sw.style.background=k===1?(ink[j]||'linear-gradient(90deg,#333 50%,#eee 50%)'):'';b.append(sw)}b.append(document.createTextNode(l));b.onclick=()=>{sel[k]=j;render()};r.append(b)});g.append(r);$('groups').append(g)}function go(v){view=v;render()}document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));document.querySelectorAll('[data-device]').forEach(b=>b.onclick=()=>{device=b.dataset.device;go('after')});$('more').onclick=$('moreBottom').onclick=()=>go('after');$('back').onclick=()=>go('after');$('tile').onclick=$('webadd').onclick=()=>go('settings');$('done').onclick=()=>go('result');$('reset').onclick=()=>{sel=[...defaults];render()};document.addEventListener('keydown',e=>{if(e.key==='Escape')go(view==='settings'?'after':'reader')});window.addEventListener('resize',fit);render();</script></html>
