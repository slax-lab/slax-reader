schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - "For a material UX change (information architecture, navigation model, multi-step flow, core interaction, primary-action placement, or whole-screen layout), offer the human an optional static mockup or clickable demo, and recommend it when requirements or intended behavior are uncertain or reversing the structure would rebuild multiple screens, flows, or tests; see DESIGN.md section 10.1. When the human accepts, let dependent implementation wait, update the requirements from the demo feedback first, and record the approval in openspec/changes/<change-id>/proposal.md. When the human declines, proceed without a demo, a record, or a repeated offer."
      - "Before suggesting a pull request, record verification in openspec/changes/<change-id>/validation.md and summarize it in the pull request's Test plan (see docs/DEFINITION-OF-DONE.md)."
      - "When all tasks are checked off, run the local pre-push review defined in REVIEW.md (all three passes) and resolve Important findings before suggesting archive or a pull request."
