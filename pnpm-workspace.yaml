packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 runs an implicit deps-status install before `pnpm exec`; a blocked
# optional build script turns that check into a hard failure. CI installs
# explicitly with --frozen-lockfile, so the auto-check buys nothing.
verifyDepsBeforeRun: false

# Reconcile dependency links after moving tooling between workspace packages;
# pnpm's optimistic check can retain the previous importer layout.
optimisticRepeatInstall: false

# pnpm 11 defaults strictDepBuilds to true: any dependency with an UNREVIEWED
# build script fails the install (ERR_PNPM_IGNORED_BUILDS). tldjs (a rulesync
# dependency) ships an optional build script we do not need — this explicit
# denial marks it reviewed; the build stays blocked.
allowBuilds:
  # lefthook's postinstall downloads the platform binary the git hooks invoke.
  lefthook: true
  tldjs: false
  # Preserve the source extension's explicit analytics postinstall opt-out.
  '@wxt-dev/analytics': false

  # Native build scripts already required by the imported frontend toolchain.
  '@firebase/util': true
  '@parcel/watcher': true
  '@swc/core': true
  'esbuild': true
  # Preserve the workspace's install-script restrictions. Standard builds use
  # published protobufjs artifacts and Sharp's platform-specific binaries.
  'protobufjs': false
  'sharp': false
  'workerd': true
  prisma: true
  '@prisma/engines': true
  '@google/genai': false
  'core-js-pure': false

overrides:
