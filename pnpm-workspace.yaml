packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 runs an implicit deps-status install before `pnpm exec`; a blocked
# optional build script turns that check into a hard failure. CI installs
# explicitly with --frozen-lockfile, so the auto-check buys nothing.
verifyDepsBeforeRun: false

# pnpm 11 defaults strictDepBuilds to true: any dependency with an UNREVIEWED
# build script fails the install (ERR_PNPM_IGNORED_BUILDS). tldjs (a rulesync
# dependency) ships an optional build script we do not need — this explicit
# denial marks it reviewed; the build stays blocked.
allowBuilds:
  # lefthook's postinstall downloads the platform binary the git hooks invoke.
  lefthook: true
  tldjs: false
