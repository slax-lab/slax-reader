# Commit-time guards: reject direct commits on the long-lived environment
# branches, and keep generated artifacts and OpenSpec specs valid — the latter
# checks CI runs in the agent-config workflow, kept in step by hand.
# To change these rules: edit this file, not .git/hooks/ (hooks are installed
# by `lefthook install`, which runs via the root `prepare` script on pnpm install).
pre-commit:
  commands:
    long-lived-branch:
      # No glob on purpose: this must run on every commit. The remote ruleset
      # rejects pushes to the environment branches; catching the mistake here
      # saves moving commits off dev/beta/main after the fact.
      run: 'case "$(git branch --show-current)" in dev|beta|main) exit 1 ;; esac'
      fail_text: "Direct commits to dev/beta/main are rejected. Cut a task branch first: git switch -c <type>/<task-name> --no-track origin/dev"
    rulesync-drift:
      glob: "{AGENTS.md,CLAUDE.md,.claude/**,.codex/**,.agents/**,.rulesync/**}"
      run: pnpm exec rulesync generate --check
      fail_text: "Generated agent files drift from .rulesync/ sources. Edit .rulesync/, run `pnpm agent:sync`, and commit both."
    gh-aw-drift:
      # Compiled agentic workflows. gh-aw hashes the whole normalized frontmatter
      # text — comments included — so editing a comment inside the frontmatter of
      # a .md source still invalidates the lock files and needs a recompile.
      # Deliberately narrower than .github/workflows/**: the hand-written
      # workflows there (this file's neighbours, pr-review-gate.yml, the paused
      # notice, agentic-noise-cleanup.yml) are never compiled and cannot drift,
      # so they must not require a pinned gh-aw to commit. aw.json is here
      # because it *is* a compile input (it sets `strict` and `help_command`).
      glob: "{.github/workflows/*.md,.github/workflows/*.lock.yml,.github/workflows/*.json,.github/workflows/shared/**,.github/aw/**}"
      run: bash tooling/check-gh-aw-drift.sh
      fail_text: "Compiled agentic workflows drift from their Markdown sources. Run `gh aw compile --strict --purge --no-check-update` and stage the result."
    openspec-validate:
      # Specs and in-flight changes must stay structurally valid. AGENTS.md
      # requires `openspec validate --all --strict` to pass before merge, and CI
      # runs exactly this command, so a spec edit that would go red on the PR can
      # no longer be committed locally. Globbed to openspec/** because the check
      # is repo-wide: without the glob, unrelated commits would be blocked by
      # unrelated spec or change state.
      glob: "openspec/**"
      run: pnpm exec openspec validate --all --strict
      fail_text: "OpenSpec specs or changes are invalid. Run `pnpm exec openspec validate --all --strict` and fix the findings."
