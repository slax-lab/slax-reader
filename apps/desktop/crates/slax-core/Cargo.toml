[package]
name = "slax-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util = "0.7.18"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "system-proxy", "json", "stream", "multipart"] }
powersync = { version = "=0.1.1", features = ["tokio", "reqwest"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
async-trait = "0.1.89"
futures-util = "0.3.32"
url = { version = "2.5.8", features = ["serde"] }
uuid = { version = "1.22.0", features = ["v4", "serde"] }
sha2 = "0.10.9"
base64 = "0.22.1"
rand = "0.9.2"
zeroize = { version = "1.8.2", features = ["derive"] }
ts-rs = { version = "11.1.0", features = ["serde-json-impl"] }
ammonia = "4.1.2"
scraper = "0.25.0"
chrono = { version = "0.4.43", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
tempfile = "3.25.0"
