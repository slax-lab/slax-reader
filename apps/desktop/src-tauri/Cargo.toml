[package]
name = "slax-reader-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }
serde_json.workspace = true

[dependencies]
slax-core = { path = "../crates/slax-core" }
tauri = { version = "=2.12.4", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-deep-link = "2.4.7"
tauri-plugin-single-instance = { version = "2.4.0", features = ["deep-link"] }
zeroize = "1.8.2"
futures-util = "0.3.32"
tokio-util = "0.7.18"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "stream"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
url = "2.5.8"
window-vibrancy = "0.7.1"
open = "5.3.3"
rfd = "0.17.2"
arboard = "3.6.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSWorkspace", "NSApplication", "NSWindow", "NSAppearance"] }
objc2-foundation = { version = "0.3.2", features = ["NSNotification", "NSOperation", "NSString", "NSDistributedNotificationCenter", "block2", "NSObject"] }
block2 = "0.6.2"
system-configuration = "0.7.0"
core-foundation = "0.9.4"
