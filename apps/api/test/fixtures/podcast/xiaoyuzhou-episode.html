AI Infra，从实验室里的突破，到真实世界的商业化，我们直击AI变化最剧烈的前沿。来自OpenAI、Anthropic、NVIDIA、Meta、Google DeepMind、SemiAnalysis、Cerebras等公司的研究者、创业者与投资人将齐聚现场，分享正在发生的机遇和挑战。\n点击报名入口 ，使用折扣码【FANS15】注册，还可以获得15%折扣。\n【硅谷101听友群】\n在这里，和同好一起深聊科技、商业与未来，期待你的声音，也期待更多有趣的讨论。\n扫码加入，即刻相遇！\n【监制】\n泓君\n【后期】\nAmei\n【运营】\n朱婕\n【BGM】\nTrace - Lennon Hutton\nSignal Containment - Out To The World\nReclaim - Megan Wofford\n【在这里找到我们】\n公众号：硅谷101\n收听渠道：Apple Podcast｜Spotify｜小宇宙｜喜马拉雅｜蜻蜓FM｜荔枝FM｜网易云音乐｜QQ音乐\n其他平台：YouTube｜Bilibili 搜索「硅谷101播客」\n联系我们：podcast@sv101.net\nSpecial Guest: 张阔.", "shownotes": "<p><img src=\"https://imagev2.xmcdn.com/storages/033e-audiofreehighqps/D4/1D/GKwRIJEOkVJYAAHpNQTf1Ew_.jpg!op_type=4&amp;device_type=ios&amp;upload_type=attachment&amp;name=mobile_large\" alt=\"\"></p><span></span><p><span>模型在榜单上越来越强，为什么真正把工作交给AI，还是需要人反复解释、检查和兜底？</span><br><span>半年前，我们与阿里国际站总裁张阔聊了Accio Work，以及Agent如何参与采购和日常经营。半年后，我们再次请到他，聊聊这半年来商家使用Accio Work的真实案例，试图回答这个问题：模型能力的提升，究竟有多少变成了商家工作里的进步？</span><br><span>张阔分享，很多模型的通用评测成绩已经接近满分，但团队在真实经营中，并没有感受到同样幅度的提升。为此，他们从实际业务中整理了107个任务，包括比较供应商报价、识别钓鱼邮件、预订船期和处理交易纠纷。据他介绍，在这套特定评测中，最前沿模型在无人干预条件下的任务通过率约为61%。</span><br><span>这些任务没有数学竞赛那么耀眼，却直接关系到商家的成本、交期和利润。一个好用的Agent，既要能把工作做完，也要让人用得起；既要理解工具和流程，也要理解这盘生意究竟想追求什么。</span><br><span>这期节目，我们聊聊榜单成绩与实际交付之间的落差、通用模型与垂直产品的竞争，以及当AI接手越来越多的执行工作，人还需要保留哪些判断。</span></p><span></span><p><strong><span>【主播】</span></strong><br><span>Yiwen，硅谷101主持人</span><br><span></span><strong><span>【嘉宾】</span></strong><br><span>张阔，阿里国际站总裁</span></p><span></span><p><strong><span>【你将听到】</span></strong><br><span></span><strong><span>从写代码到做生意，Agent还差什么？</span></strong><br><span><a class=\"timestamp\" data-timestamp=\"78\">01:18</a> AI同事市场：编程之外，专业工作走到了哪一步？</span><br><span><a class=\"timestamp\" data-timestamp=\"158\">02:38</a> 商业任务为什么比编程更难？</span><br><span><a class=\"timestamp\" data-timestamp=\"228\">03:48</a> 从采购搜索到日常经营，Accio Work的任务边界如何扩展</span><br><span><a class=\"timestamp\" data-timestamp=\"372\">06:12</a> 商家案例：植物监测产品，从创意走到设计、供应链和销售</span><br><span><a class=\"timestamp\" data-t
